<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Somni</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#080614;--violet:#7B5CF0;--violet-light:#A78BFA;--muted:rgba(255,255,255,0.5)}
body{
  font-family:'DM Sans',sans-serif;
  background:radial-gradient(ellipse at 50% 0%,rgba(123,92,240,0.22),transparent 60%),var(--ink);
  color:#fff;line-height:1.6;min-height:100vh;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:1.5rem;
}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:2rem}
h1{font-family:'Cormorant Garamond',serif;font-size:2.3rem;font-weight:300;margin-bottom:0.75rem}
p{color:var(--muted);font-weight:300;margin-bottom:1.75rem}
a.btn{display:inline-block;padding:0.85rem 1.8rem;border-radius:100px;background:var(--violet);color:#fff;text-decoration:none;font-size:0.9rem;font-weight:500}
a.btn:hover{background:#6B4FD8}
a.btn:focus-visible{outline:2px solid var(--violet-light);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="logo">🌙 Somni</div>
  <h1>Page not found</h1>
  <p>That page drifted off into the night.</p>
  <a class="btn" href="/">Go to mysomni.app</a>
</main>
<script>
  // Share links look like /r/<CODE>; the r/ page itself reads ?c=CODE.
  var m = /^\/r\/([A-Za-z0-9]+)\/?$/i.exec(window.location.pathname);
  if (m) window.location.replace('/r/?c=' + m[1].toUpperCase());
</script>
</body>
</html>
